name: Validate deterministic engine
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify engine and scenarios
        run: npm test
      - name: Syntax checks
        run: |
          node --check src/engine.mjs
          node --check src/app.mjs
          node --check src/scenario.mjs
          node --check server.mjs
          node --check worker/index.mjs
          node --check tests/worker.test.mjs
